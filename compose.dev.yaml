# Hot-reload overlay, used by `make watch`:
#   docker compose -f docker-compose.yml -f compose.dev.yaml watch
services:
  api:
    build: { context: apps/api, target: dev }
    image: patient-registry-api-dev
    develop:
      watch:
        - { action: sync, path: ./apps/api/src, target: /app/src }
        - { action: sync, path: ./apps/api/migrations, target: /app/migrations }
        - { action: rebuild, path: ./apps/api/uv.lock }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: dev }
    environment:
      API_PROXY_TARGET: http://api:8000
      FLAGD_PROXY_TARGET: http://flagd:8013
    ports: !override
      - "${WEB_PORT:-8080}:5173"
    develop:
      watch:
        - { action: sync, path: ./apps/web/src, target: /repo/apps/web/src }
        - { action: sync, path: ./apps/web/public, target: /repo/apps/web/public }
        - { action: rebuild, path: ./apps/web/package.json }
        - { action: rebuild, path: ./pnpm-lock.yaml }

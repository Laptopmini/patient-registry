name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Real Postgres via testcontainers; includes the OpenAPI drift test.
      - run: uv run pytest

  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contract drift check: the committed client must match apps/api/openapi.json.
      - run: pnpm generate:api && git diff --exit-code src/api/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Compose · build and smoke test
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --wait --wait-timeout 300
      - run: ./scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  e2e:
    name: E2E · Playwright and axe
    needs: [stack]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      # A fresh database each run: the seed is re-applied and no test depends on its order.
      - run: docker compose down -v && docker compose up --build --wait --wait-timeout 300
        working-directory: .
      - run: pnpm e2e
        env:
          BASE_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - if: always()
        run: docker compose down -v
        working-directory: .

  lighthouse:
    name: Lighthouse · mobile and desktop
    needs: [stack]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 300
        working-directory: .
      - run: pnpm lhci
        env:
          BASE_URL: http://localhost:8080
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 7
      - if: always()
        run: docker compose down -v
        working-directory: .
